# CodeWitness configuration for the Go withdrawal-ledger fixture.
#
# This file declares how each requirement can be *executed* against the code. CodeWitness supplies
# boundary enumeration, seeded random search, execution and reproducible counterexamples; the Go
# fragments below are the oracle, and they are attributed to the user, not to CodeWitness.
#
# Nothing here needs a third-party module: the generated tests are ordinary *_test.go files placed in
# the package under test, use only the standard library, and run with the toolchain the project
# already has. Fragments are Go statements and reference inputs as ${name}.

project:
  name: go-withdrawal-ledger

language:
  adapter: go

verification:
  timeout: 5m
  max_duration: 10m
  max_test_generation_iterations: 3
  max_generated_tests: 120
  max_mutation_time: 5m

tests:
  enabled: true

mutation:
  enabled: true
  tool: go-text

property_testing:
  enabled: true
  max_scenarios: 10

static_analysis:
  enabled: true
  analyzers: [heuristics]

security:
  enabled: true

llm:
  enabled: false
  provider: none

report:
  html: true
  json: true

sandbox:
  mode: local-process
  allow_network: false

scenarios:
  # R-001: two withdrawals an hour and ten minutes apart, across midnight, must still respect the
  # rolling limit. Amounts and instants are integer minor units, so no decimal type is needed.
  - id: SC-ROLLING
    requirement: R-001
    description: Two withdrawals across midnight, one hour apart
    mode: sequence
    setup: |
      l := New()
    steps:
      - call: "l.Withdraw(${t1}, ${a1})"
        description: first withdrawal at 23:50
        inputs:
          - name: t1
            type: int64
            domain: integer
            values: ["85800000"]
            range: {min: 0, max: 172800000}
          - name: a1
            type: int64
            domain: integer
            values: ["70000"]
            range: {min: 10000, max: 90000}
      - call: "l.Withdraw(${t2}, ${a2})"
        description: second withdrawal at 01:00 the next day
        inputs:
          - name: t2
            type: int64
            domain: integer
            values: ["90000000"]
          - name: a2
            type: int64
            domain: integer
            values: ["70000"]
    observation: "l.TotalWithinLast24Hours(${t2})"
    invariant: "observation <= 100000"
    cases: 200
    seed: 42

  # R-002: a fee must change the recorded total. The invariant is checked after every step, so the
  # whole experiment is expressed as one step: record 100, apply 0.50, then read the total.
  - id: SC-FEE
    requirement: R-002
    description: Applying a fee must increase the recorded total
    mode: single
    setup: |
      l := New()
    steps:
      - call: "l.Withdraw(0, 10000); l.ApplyFee(50)"
        description: record a withdrawal of 100 and apply a fee of 0.50
    observation: "l.TotalWithinLast24Hours(3600000)"
    invariant: "observation == 10050"
    cases: 1
    seed: 1

  # R-003: negative amounts must be rejected and must not reduce the recorded total.
  - id: SC-NEGATIVE
    requirement: R-003
    description: Negative amounts must be rejected
    mode: single
    setup: |
      l := New()
    steps:
      - call: "l.Withdraw(0, 50000)"
        description: record a withdrawal of 500
      - call: "l.Withdraw(3600000, ${amount})"
        description: attempt a negative withdrawal
        inputs:
          - name: amount
            type: int64
            domain: integer
            values: ["-10000"]
            range: {min: -10000, max: -1}
    observation: "l.TotalWithinLast24Hours(3600000)"
    invariant: "observation >= 50000"
    cases: 1
    seed: 1
