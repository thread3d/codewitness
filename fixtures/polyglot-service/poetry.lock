# Machine-generated by Poetry. CodeWitness reads the resolved versions from this file rather than the
# ranges in pyproject.toml, because an advisory is a statement about a version. The pins are chosen so
# that no advisory applies, not the versions Poetry first wrote: certifi 2024.2.2 carried
# CVE-2024-39689 and 2025.1.31 carried GHSA-6q48-6c7w-9gw2 (emSign root CAs with compromised
# intermediate CA keys); requests 2.31.0 carried CVE-2024-35195, CVE-2024-47081 and CVE-2026-25645.
# Dependabot's security updates for this fixture fail with `security_update_dependency_not_found`
# because the manifest declares no dependencies for it to edit, so bumping the lock by hand is what
# clears the alerts.
[[package]]
name = "certifi"
version = "2026.10.23"
description = "Python package for providing Mozilla's CA Bundle."
optional = false
python-versions = ">=3.6"

[[package]]
name = "requests"
version = "2.33.0"
description = "Python HTTP for Humans."
optional = false
python-versions = ">=3.7"
