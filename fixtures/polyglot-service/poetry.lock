# ranges in pyproject.toml, because an advisory is a statement about a version. The two pins are the
# newest resolved versions, not the ones Poetry first wrote: certifi 2024.2.2 carried CVE-2024-39689
# and requests 2.31.0 carried CVE-2024-35195, CVE-2024-47081 and CVE-2026-25645, and Dependabot's
# security updates for this fixture failed with `security_update_dependency_not_found` because the
# manifest declares no dependencies for it to edit. Bumping the lock is what clears the alerts.
[[package]]
