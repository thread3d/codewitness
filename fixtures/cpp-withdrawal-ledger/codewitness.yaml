# CodeWitness configuration for the C++ withdrawal-ledger fixture.
#
# This file declares how each requirement can be *executed* against the code. CodeWitness supplies
# boundary enumeration, seeded random search, execution and reproducible counterexamples; the C++
# fragments below are the oracle, and they are attributed to the user, not to CodeWitness.
#
# A generated test is one self-contained C++ translation unit that CodeWitness compiles with the flags
# the project's own CMake build recorded in compile_commands.json and links against the library that
# build produced. Nothing is added to the project's CMakeLists.txt: the generated test is built the way
# the project builds itself, without becoming part of it. The scenario fragments are C++ statements and
# reference inputs as ${name}; the includes the generated file needs are the project's own headers, which
# CodeWitness includes for it.

project:
  name: cpp-withdrawal-ledger

language:
  adapter: cpp

verification:
  timeout: 5m
  max_duration: 10m
  max_test_generation_iterations: 3
  max_generated_tests: 120
  max_mutation_time: 3m

tests:
  enabled: true

mutation:
  enabled: true
  tool: cpp-text

property_testing:
  enabled: true
  max_scenarios: 10

static_analysis:
  enabled: true
  analyzers: [heuristics]

security:
  enabled: true

llm:
  enabled: false
  provider: none

report:
  html: true
  json: true

sandbox:
  mode: local-process
  allow_network: false

scenarios:
  # R-001: two withdrawals an hour and ten minutes apart, across midnight, must still respect the rolling
  # limit. Amounts and instants are integer minor units, so no decimal type is needed.
  - id: SC-ROLLING
    requirement: R-001
    description: Two withdrawals across midnight, one hour and ten minutes apart
    mode: sequence
    setup: |
      auto l = ledger::WithdrawalLedger();
    steps:
      - call: "l.withdraw(${t1}, ${a1})"
        description: first withdrawal at 23:50
        inputs:
          - name: t1
            type: long long
            domain: integer
            values: ["85800000"]
            range: {min: 0, max: 172800000}
          - name: a1
            type: long long
            domain: integer
            values: ["70000"]
            range: {min: 10000, max: 90000}
      - call: "l.withdraw(${t2}, ${a2})"
        description: second withdrawal at 01:00 the next day
        inputs:
          - name: t2
            type: long long
            domain: integer
            values: ["90000000"]
          - name: a2
            type: long long
            domain: integer
            values: ["70000"]
    observation: "l.totalWithinLast24Hours(${t2})"
    invariant: "observation <= 100000"
    cases: 200
    seed: 42

  # R-002: a fee must change the recorded total. The whole experiment is one step: record 100, apply
  # 0.50, then read the total.
  - id: SC-FEE
    requirement: R-002
    description: Applying a fee must increase the recorded total
    mode: single
    setup: |
      auto l = ledger::WithdrawalLedger();
    steps:
      - call: "l.withdraw(0, 10000); l.applyFee(50)"
        description: record a withdrawal of 100 and apply a fee of 0.50
    observation: "l.totalWithinLast24Hours(3600000)"
    invariant: "observation == 10050"
    cases: 1
    seed: 1

  # R-003: negative amounts must be rejected and must not reduce the recorded total.
  - id: SC-NEGATIVE
    requirement: R-003
    description: Negative amounts must be rejected
    mode: single
    setup: |
      auto l = ledger::WithdrawalLedger();
    steps:
      - call: "l.withdraw(0, 50000)"
        description: record a withdrawal of 500
      - call: "l.withdraw(3600000, ${amount})"
        description: attempt a negative withdrawal
        inputs:
          - name: amount
            type: long long
            domain: integer
            values: ["-10000"]
            range: {min: -10000, max: -1}
    observation: "l.totalWithinLast24Hours(3600000)"
    invariant: "observation >= 50000"
    cases: 1
    seed: 1
