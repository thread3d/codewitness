# CodeWitness configuration for the Python withdrawal-ledger fixture.
#
# This file declares how each requirement can be *executed* against the code. CodeWitness supplies
# boundary enumeration, seeded random search, execution and reproducible counterexamples; the Python
# fragments below are the oracle, and they are attributed to the user, not to CodeWitness.
#
# Nothing here needs a third-party Python package: the generated tests are standard-library unittest
# cases, so they run on the interpreter the project already has.

project:
  name: python-withdrawal-ledger

language:
  adapter: python

verification:
  timeout: 5m
  max_duration: 10m
  max_test_generation_iterations: 3
  max_generated_tests: 120
  max_mutation_time: 5m

tests:
  enabled: true

mutation:
  enabled: true
  tool: python-ast

property_testing:
  enabled: true
  max_scenarios: 10

static_analysis:
  enabled: true
  analyzers: [heuristics]

security:
  enabled: true

llm:
  enabled: false
  provider: none

report:
  html: true
  json: true

sandbox:
  mode: local-process
  allow_network: false

scenarios:
  # R-001: two withdrawals an hour and ten minutes apart, across midnight, must still respect the
  # rolling limit.
  - id: SC-ROLLING
    requirement: R-001
    description: Two withdrawals across midnight, one hour apart
    mode: sequence
    setup: |
      from ledger import WithdrawalLedger
      ledger = WithdrawalLedger()
    steps:
      - call: "ledger.withdraw(${t1}, ${a1})"
        description: first withdrawal at 23:50
        inputs:
          - name: t1
            type: int
            domain: integer
            values: ["85800000"]
            range: {min: 0, max: 172800000}
          - name: a1
            type: decimal.Decimal
            domain: decimal
            values: ["700"]
            range: {min: 100, max: 900, scale: 2}
      - call: "ledger.withdraw(${t2}, ${a2})"
        description: second withdrawal at 01:00 the next day
        inputs:
          - name: t2
            type: int
            domain: integer
            values: ["90000000"]
          - name: a2
            type: decimal.Decimal
            domain: decimal
            values: ["700"]
    observation: "ledger.total_within_last_24_hours(${t2})"
    invariant: "observation <= decimal.Decimal(\"1000\")"
    cases: 200
    seed: 42

  # R-002: a fee must change the recorded total. The invariant is checked after every step, so the
  # whole experiment is expressed as one step: record 100, apply 0.50, then read the total.
  - id: SC-FEE
    requirement: R-002
    description: Applying a fee must increase the recorded total
    mode: single
    setup: |
      from ledger import WithdrawalLedger
      ledger = WithdrawalLedger()
    steps:
      - call: "ledger.withdraw(0, decimal.Decimal(\"100\")); ledger.apply_fee(decimal.Decimal(\"0.50\"))"
        description: record a withdrawal of 100 and apply a fee of 0.50
    observation: "ledger.total_within_last_24_hours(3600000)"
    invariant: "observation == decimal.Decimal(\"100.50\")"
    cases: 1
    seed: 1

  # R-003: negative amounts must be rejected and must not reduce the recorded total.
  - id: SC-NEGATIVE
    requirement: R-003
    description: Negative amounts must be rejected
    mode: single
    setup: |
      from ledger import WithdrawalLedger
      ledger = WithdrawalLedger()
    steps:
      - call: "ledger.withdraw(0, decimal.Decimal(\"500\"))"
        description: record a withdrawal of 500
      - call: "ledger.withdraw(3600000, ${amount})"
        description: attempt a negative withdrawal
        inputs:
          - name: amount
            type: decimal.Decimal
            domain: decimal
            values: ["-100"]
            range: {min: -100, max: -1, scale: 2}
    observation: "ledger.total_within_last_24_hours(3600000)"
    invariant: "observation >= decimal.Decimal(\"500\")"
    cases: 1
    seed: 1
