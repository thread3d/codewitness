name: CI

# Push to main and every pull request. Nothing here needs a repository secret, and the optional
# language-model feature is never enabled: no step passes --llm or sets an API key.
on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository.
permissions:
  contents: read

# A new push to the same ref cancels the previous in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (Java 25)
    runs-on: ubuntu-latest
    # The end-to-end suite builds every fixture project from scratch, several of them through their own
    # toolchain; give it room, but do not let a hung nested build occupy a runner forever.
    timeout-minutes: 60

    steps:
      # Every action below is pinned to a full-length commit SHA rather than a movable tag or
      # branch, so a compromised or re-pointed upstream ref cannot change what this workflow runs.
      # The trailing comment names the release the SHA came from and is what Dependabot reads to
      # propose updates (.github/dependabot.yml). This workflow is never run from a fork pull
      # request with write credentials - `permissions` above is read-only - so pinning is the
      # remaining supply-chain control.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The project targets release 25 (pom.xml: maven.compiler.release=25), so the JDK must be 25.
      # cache: maven caches ~/.m2/repository keyed on the poms and the wrapper properties.
      - name: Set up Temurin JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # ---------------------------------------------------------------------------------------
      # Toolchains for the end-to-end suite.
      #
      # `./mvnw -Pe2e test` runs the fixture projects through their own toolchains: Maven for the
      # Java fixture, Python 3, Cargo, `go`, Node for the others (Node 22.18+ for TypeScript, where
      # type stripping is on by default, and 18.17+ for JavaScript), the .NET SDK for the C# fixture,
      # CMake for the C and C++ one, PHP with Composer for the PHP one, Ruby with Bundler for the
      # Ruby one, Swift for the Swift one, Icarus Verilog for the Verilog one, and GHDL for the VHDL one.
      # The Kotlin, PHP and Ruby fixtures are the ones whose test tool is not part of the language
      # toolchain - Kotlin's compiler and Surefire, PHP's PHPUnit and Ruby's RSpec are all resolved as
      # dependencies - so all three are warmed below, and all three need the network this job already has.
      # Swift is the opposite case twice over: XCTest ships with the toolchain, and the fixture has no
      # external packages, so nothing is warmed and the fixture's sandbox forbids the network. Swift
      # itself comes from the runner image, like CMake and CTest, and is asserted below rather than
      # installed: the image's Swift 6.x satisfies the fixture's 5.9 tools version, and a silently
      # substituted toolchain is what the assertion makes visible.
      # Verilog is the same shape as Swift: Icarus Verilog is a compiler and a simulator in one
      # package, and the fixture has no dependencies to resolve, so nothing is warmed for it. Unlike
      # Swift it is not on the runner image - Ubuntu 24.04 ships neither iverilog nor verilator - so
      # the package is installed in its own step below and asserted with the rest.
      # Pascal is the same shape as Swift and Verilog together: Free Pascal is a compiler, and the
      # fpcunit framework it is tested with ships inside the same distribution, so nothing is warmed and
      # the fixture forbids the network. Ubuntu 24.04 does carry `fpc`, so its own step installs it and
      # the assertion below checks the version rather than trusting the image.
      # VHDL is that same shape once more: GHDL analyses, elaborates and simulates, the fixture has no
      # dependencies, and Ubuntu 24.04 carries `ghdl` in universe, so its own step installs it and the
      # assertion below checks the version rather than trusting the image.
      # Each end-to-end test skips itself (a JUnit assumption) when its toolchain is absent, so a missing
      # tool produces a green build with those languages never having run. Installing each one here, then
      # asserting it below, is what keeps that from happening silently.
      # ---------------------------------------------------------------------------------------
      - name: Set up Python 3
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      # Pinned to the commit at the tip of dtolnay/rust-toolchain's `stable` branch, which is what
      # `@stable` resolved to. That branch is a moving ref: pinning freezes the toolchain at the
      # Rust release current on 2026-10-01, so a rustc upgrade from here on is a deliberate pin
      # update, not something an upstream branch silently changes under the build.
      - name: Set up Cargo
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable 2026-10-01

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'

      # Node 22 resolves to the latest 22.x, which satisfies the TypeScript adapter's 22.18 floor
      # (type stripping is only on by default from 22.18) and the JavaScript adapter's 18.17 floor.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # The C# fixture targets net8.0, so the SDK that builds it is the 8.0 one. The fixture's sandbox
      # configuration forbids the network, and the SDK's test host packages are in the runner's NuGet
      # cache after this step (it restores them), which is what lets the fixture's `dotnet test` run
      # offline the way it does on a developer's machine.
      - name: Set up .NET SDK 8.0
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      # Pin Maven instead of trusting whatever the runner image happens to ship. The Java fixture is
      # built by `BuildToolLauncher.resolve`, which looks for a wrapper in the fixture (there is none),
      # then MAVEN_HOME/M2_HOME, then `mvn` on PATH - so Maven has to be on PATH, and the version has to
      # be one we chose. 3.9.16 is the version this repository's own wrapper pins.
      - name: Set up Maven 3.9.16
        uses: stCarolas/setup-maven@12eb41b233df95d49b0c11fc1b5bc8312e5d4ce0 # v5.1
        with:
          maven-version: 3.9.16

      # PHP and Composer are what the PHP fixture drives. Composer is not optional here even though the
      # adapter can build and analyse a tree without it: PHPUnit is a Composer dependency rather than part
      # of the language toolchain, so a PHP project's tests only exist once `composer install` has run.
      # `coverage: xdebug` is what makes the fixture's coverage measurable at all - PHPUnit has no coverage
      # driver of its own, and the adapter reports coverage as not measured rather than as zero when none
      # is loaded, so without this the coverage phase would be reported but never exercised.
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: xdebug

      # Ruby and Bundler are what the Ruby fixture drives. The runner image alone is not enough: its
      # Ruby comes from Ubuntu's ruby-full package, and on Ubuntu 24.04 that installs the versioned
      # /usr/bin/bundle3.2 but no unversioned `bundle` - the ruby-bundler package that provides it is
      # not a dependency - so a bare `bundle install` fails on a command the image does not have.
      # 4.0 is the interpreter the fixture's committed Gemfile.lock was resolved with: its BUNDLED
      # WITH is 4.0.20, the Bundler that ships as a default gem with Ruby 4.0, so setup-ruby installs
      # the Bundler the lock names rather than whichever one the image happens to carry.
      - name: Set up Ruby
        uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: '4.0'

      # Icarus Verilog is what the Verilog fixture drives: `iverilog` compiles a testbench and `vvp`
      # simulates it. Ubuntu 24.04 ships neither simulator, so the package is installed here. The
      # adapter relies on `-g2012` (the SystemVerilog dialect flag) and on `$fatal` making `vvp` exit
      # non-zero; both are present in the distribution's 12.0, and the version floor is asserted below
      # rather than trusted, like every other toolchain in this job.
      - name: Set up Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      # Free Pascal is what the Pascal fixture drives, and fpcunit - the test framework the adapter runs -
      # ships inside the same package, so no second dependency is installed. Ubuntu 24.04 carries 3.2.2,
      # whose diagnostics, `-o`/`-FU` switches and fpcunit XML output the adapter relies on; the version
      # floor is asserted below rather than trusted, like every other toolchain in this job.
      - name: Set up Free Pascal
        run: |
          sudo apt-get install -y fpc

      # GHDL is what the VHDL fixture drives: `ghdl -a` analyses the design units into a work library,
      # `ghdl -e` elaborates the top entity and `ghdl -r` simulates each testbench. Ubuntu 24.04 carries
      # 4.1.0, whose `--std=08`, `--workdir`, `--assert-level=error` and `std.env.finish` the adapter
      # relies on. The version floor is asserted below rather than trusted, like every other toolchain
      # in this job.
      - name: Set up GHDL
        run: |
          sudo apt-get install -y ghdl

      # CMake and the CTest that ships with it are what the C and C++ fixture drives, and they come from
      # the runner image rather than from an action. The version is therefore asserted in the step below
      # instead of trusted: the test phase reads the JUnit report `ctest --output-junit` writes, and that
      # option first appeared in CMake 3.21. Ninja is what the adapter chooses as its generator when it is
      # present and CMake's own default when it is not, so ninja is not asserted - the run records which
      # generator it used either way.
      #
      # Warm the Kotlin toolchain into the Maven cache. The Kotlin fixture resolves the Kotlin compiler,
      # the standard library and Surefire from the repository on first use, which needs the network that
      # every other step in this job also uses; doing it here means the end-to-end run is measuring the
      # adapter rather than a download, and a repository that stops answering fails this step loudly
      # instead of failing one fixture's build.
      - name: Warm the Kotlin toolchain
        run: ./mvnw -B -ntp -f fixtures/kotlin-withdrawal-ledger/pom.xml -DskipTests test-compile

      # Warm the PHP fixture's Composer install for the same reason. The fixture commits its
      # composer.lock, so this resolves the exact tree the end-to-end run will resolve, and leaves it in
      # Composer's cache: the run itself still installs into its own isolated workspace, which is what
      # keeps the fixture honest about building from source rather than from a pre-populated vendor.
      - name: Warm the PHP fixture's dependencies
        run: composer install --no-interaction --no-progress --working-dir=fixtures/php-withdrawal-ledger

      # Warm the Ruby fixture's bundle for the same reason, and with the same caveat: the fixture commits
      # its Gemfile.lock, so this resolves the exact tree the end-to-end run will resolve. Bundler is the
      # one the Set up Ruby step installed, which the lock's BUNDLED WITH names; the version floor is
      # still asserted below instead of trusted, so a substituted interpreter is visible rather than
      # silent.
      - name: Warm the Ruby fixture's dependencies
        env:
          BUNDLE_GEMFILE: fixtures/ruby-withdrawal-ledger/Gemfile
        run: bundle install

      # Fail loudly rather than trust the runner image. Absent tools make the end-to-end tests skip
      # themselves (a JUnit assumption), which is a green build with those languages never having run.
      # The Maven check asserts the pinned version, so a silently substituted Maven is visible too.
      - name: Assert every toolchain is present
        run: |
          set -euo pipefail
          java -version
          mvn -v
          mvn -v | grep -q '3\.9\.16'
          python3 --version
          cargo --version
          go version
          node --version
          dotnet --version
          cmake --version
          ctest --version
          # 3.21 is the first CMake whose ctest can write the JUnit report the C and C++ test phase reads.
          cmake --version | head -1 | grep -qE 'version (3\.(2[1-9]|[3-9][0-9])|[4-9]\.)'
          php --version
          composer --version
          # 8.1 is the floor the fixture declares and the lowest PHPUnit 11 supports.
          php -r 'exit(PHP_VERSION_ID >= 80100 ? 0 : 1);'
          # The adapter reports coverage as not measured when no driver is loaded; assert the driver is
          # here so that the coverage phase is exercised rather than silently skipped in the report.
          php -m | grep -qi xdebug
          ruby --version
          bundle --version
          # 4.0 is the interpreter the Set up Ruby step pins, which is what the fixture's lock was
          # resolved with; the adapter itself assumes only a 3.1 floor, but a substituted interpreter
          # here would mean the fixture ran against a Bundler the lock does not name.
          ruby -e 'exit(Gem::Version.new(RUBY_VERSION) >= Gem::Version.new("4.0") ? 0 : 1)'
          swift --version
          # 5.9 is the fixture's swift-tools-version, so anything older cannot even read its manifest;
          # the 6.x line the image ships satisfies it. Asserted rather than trusted for the same reason
          # every other toolchain here is: a silently substituted compiler must be visible.
          swift --version | grep -qE 'Swift version (5\.(9|[1-9][0-9])|[6-9]\.|[1-9][0-9]+\.)'
          iverilog -V
          vvp -V
          # 12.0 is the distribution's Icarus release and the floor for -g2012 and for $fatal making
          # vvp exit non-zero, which the build, the test phase and every mutant depend on. A missing
          # simulator would otherwise make the Verilog end-to-end test skip itself silently. grep reads
          # the whole output rather than piping through head, which would risk a SIGPIPE under pipefail.
          iverilog -V | grep -qE 'Icarus Verilog version (1[2-9]|[2-9][0-9])\.'
          fpc -iV
          # 3.2 is the distribution's Free Pascal release and the floor the adapter's diagnostics parsing
          # and fpcunit XML output were written against. A missing compiler would otherwise make the
          # Pascal end-to-end test skip itself silently.
          fpc -iV | grep -qE '^(3\.[2-9]|[4-9]\.)'
          ghdl --version
          # 4.0 is the floor the adapter's VHDL-2008 (std.env) usage and its simulation options were
          # written against; Ubuntu 24.04 ships 4.1. A missing simulator would otherwise make the VHDL
          # end-to-end test skip itself silently.
          ghdl --version | grep -qE 'GHDL (4\.|5\.|6\.|[7-9]\.|[1-9][0-9]+\.)'

      # Unit and integration tests. Surefire excludes the `e2e` group by default (pom.xml:
      # excluded.groups), so this is the fast suite.
      - name: Unit and integration tests
        run: ./mvnw -B test

      # The end-to-end suite, opt-in through the `e2e` profile, which clears excluded.groups. It
      # builds the fixture projects with real Maven, Python, Cargo, Go, Node, .NET, CMake, Composer,
      # Bundler, Swift, Icarus Verilog, Free Pascal and GHDL runs.
      - name: End-to-end tests (fixture projects)
        run: ./mvnw -B -Pe2e test
