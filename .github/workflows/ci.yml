name: CI

# Push to main and every pull request. Nothing here needs a repository secret, and the optional
# language-model feature is never enabled: no step passes --llm or sets an API key.
on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository.
permissions:
  contents: read

# A new push to the same ref cancels the previous in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (Java 25)
    runs-on: ubuntu-latest
    # The end-to-end suite builds every fixture project from scratch, several of them through their own
    # toolchain; give it room, but do not let a hung nested build occupy a runner forever.
    timeout-minutes: 60

    steps:
      # Every action below is pinned to a full-length commit SHA rather than a movable tag or
      # branch, so a compromised or re-pointed upstream ref cannot change what this workflow runs.
      # The trailing comment names the release the SHA came from and is what Dependabot reads to
      # propose updates (.github/dependabot.yml). This workflow is never run from a fork pull
      # request with write credentials - `permissions` above is read-only - so pinning is the
      # remaining supply-chain control.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The project targets release 25 (pom.xml: maven.compiler.release=25), so the JDK must be 25.
      # cache: maven caches ~/.m2/repository keyed on the poms and the wrapper properties.
      - name: Set up Temurin JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # ---------------------------------------------------------------------------------------
      # Toolchains for the end-to-end suite.
      #
      # `./mvnw -Pe2e test` runs the fixture projects through their own toolchains: Maven for the
      # Java fixture, Python 3, Cargo, `go`, Node for the others (Node 22.18+ for TypeScript, where
      # type stripping is on by default, and 18.17+ for JavaScript) and the .NET SDK for the C# fixture.
      # The Kotlin fixture is a Maven build with the Kotlin plugin, so its toolchain is the Maven and the
      # network this job already has: the compiler, the standard library and Surefire are fetched the way
      # a dependency is, and the step below warms them so that the fixture cannot silently skip.
      # Each end-to-end test skips itself (a JUnit assumption) when its toolchain is absent, so a missing
      # tool produces a green build with those languages never having run. Installing each one here, then
      # asserting it below, is what keeps that from happening silently.
      # ---------------------------------------------------------------------------------------
      - name: Set up Python 3
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      # Pinned to the commit at the tip of dtolnay/rust-toolchain's `stable` branch, which is what
      # `@stable` resolved to. That branch is a moving ref: pinning freezes the toolchain at the
      # Rust release current on 2026-10-01, so a rustc upgrade from here on is a deliberate pin
      # update, not something an upstream branch silently changes under the build.
      - name: Set up Cargo
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable 2026-10-01

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'

      # Node 22 resolves to the latest 22.x, which satisfies the TypeScript adapter's 22.18 floor
      # (type stripping is only on by default from 22.18) and the JavaScript adapter's 18.17 floor.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # The C# fixture targets net8.0, so the SDK that builds it is the 8.0 one. The fixture's sandbox
      # configuration forbids the network, and the SDK's test host packages are in the runner's NuGet
      # cache after this step (it restores them), which is what lets the fixture's `dotnet test` run
      # offline the way it does on a developer's machine.
      - name: Set up .NET SDK 8.0
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      # Pin Maven instead of trusting whatever the runner image happens to ship. The Java fixture is
      # built by `BuildToolLauncher.resolve`, which looks for a wrapper in the fixture (there is none),
      # then MAVEN_HOME/M2_HOME, then `mvn` on PATH - so Maven has to be on PATH, and the version has to
      # be one we chose. 3.9.16 is the version this repository's own wrapper pins.
      - name: Set up Maven 3.9.16
        uses: stCarolas/setup-maven@12eb41b233df95d49b0c11fc1b5bc8312e5d4ce0 # v5.1
        with:
          maven-version: 3.9.16

      # Warm the Kotlin toolchain into the Maven cache. The Kotlin fixture resolves the Kotlin compiler,
      # the standard library and Surefire from the repository on first use, which needs the network that
      # every other step in this job also uses; doing it here means the end-to-end run is measuring the
      # adapter rather than a download, and a repository that stops answering fails this step loudly
      # instead of failing one fixture's build.
      - name: Warm the Kotlin toolchain
        run: ./mvnw -B -ntp -f fixtures/kotlin-withdrawal-ledger/pom.xml -DskipTests test-compile

      # Fail loudly rather than trust the runner image. Absent tools make the end-to-end tests skip
      # themselves (a JUnit assumption), which is a green build with those languages never having run.
      # The Maven check asserts the pinned version, so a silently substituted Maven is visible too.
      - name: Assert every toolchain is present
        run: |
          set -euo pipefail
          java -version
          mvn -v
          mvn -v | grep -q '3\.9\.16'
          python3 --version
          cargo --version
          go version
          node --version
          dotnet --version

      # Unit and integration tests. Surefire excludes the `e2e` group by default (pom.xml:
      # excluded.groups), so this is the fast suite.
      - name: Unit and integration tests
        run: ./mvnw -B test

      # The end-to-end suite, opt-in through the `e2e` profile, which clears excluded.groups. It
      # builds the fixture projects with real Maven, Python, Cargo, Go, Node and .NET runs.
      - name: End-to-end tests (fixture projects)
        run: ./mvnw -B -Pe2e test
